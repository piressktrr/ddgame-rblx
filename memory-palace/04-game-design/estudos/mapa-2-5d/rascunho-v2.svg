<text x="30" y="169" fill="#fff" font-size="30">Tutorial</text>
<text x="36" y="259" fill="#fff" font-size="20">gancho: mirar,</text>
<text x="36" y="289" fill="#fff" font-size="20">segurar, balançar,</text>
<text x="36" y="319" fill="#fff" font-size="20">W/S, roxo, verde</text>
<text x="36" y="475" fill="#fff" font-size="20">portal → E1</text>
<text x="480" y="205" fill="#fff" font-size="30">E1 · Salão dos pilares</text>
<text x="564" y="289" fill="#fff" font-size="20">vãos de 30+: gancho no teto · cair = morte</text>
<text x="564" y="313" fill="#fff" font-size="20">gelo no 3º pilar, laranja no 4º</text>
<text x="1182" y="499" fill="#fff" font-size="20">respiro</text>
<text x="1230" y="589" fill="#fff" font-size="30">E2 · Corredor dos dentes</text>
<text x="1200" y="799" fill="#fff" font-size="20">chão mortal · plataforma do meio: metade gelo, metade laranja</text>
<text x="1380" y="895" fill="#fff" font-size="30">E3 · Vale em V  ←</text>
<text x="1380" y="1255" fill="#fff" font-size="20">gelo no caminho antes da descida</text>
<text x="1056" y="907" fill="#fff" font-size="24">✦ Farol 1</text>
<text x="315" y="511" fill="#fff" font-size="30">E4 · Serpentina ↑</text>
<text x="312" y="1255" fill="#fff" font-size="20">sobe em zigue-zague · pontas roxas · faixas mortais · um andar com gelo</text>
<text x="1230" y="160" fill="#fff" font-size="20">respiro</text>
<text x="2310" y="103" fill="#fff" font-size="30">E5 · Campo flutuante (em cima) ou Labirinto (embaixo)</text>
<text x="2250" y="475" fill="#fff" font-size="20">labirinto: lento e seguro, com 1 gelo</text>
<text x="2484" y="667" fill="#fff" font-size="24">✦ Farol 2 (fim)</text>
<text x="2490" y="865" fill="#fff" font-size="30">E6 · Poço ↓ e subida ↑</text>
<text x="2490" y="895" fill="#fff" font-size="20">lâminas mortais no poço,</text>
<text x="2490" y="925" fill="#fff" font-size="20">gelo no fundo, S com verde</text>
<rect x="20" y="1330" width="26" height="26" fill="#c8ecff"/>
<text x="54" y="1351" fill="#fff" font-size="22">gelo</text>
