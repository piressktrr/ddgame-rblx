<text x="30" y="154" fill="#fff" font-size="30">Tutorial do gancho</text>
<text x="36" y="244" fill="#fff" font-size="20">ensina mirar, segurar,</text>
<text x="36" y="274" fill="#fff" font-size="20">balançar, W/S, roxo e verde</text>
<text x="36" y="460" fill="#fff" font-size="20">→ porta para o E1</text>
<text x="480" y="154" fill="#fff" font-size="30">E1 · Salão dos pilares</text>
<text x="582" y="244" fill="#fff" font-size="20">vãos de 36 studs: só passa enganchando no teto · cair = morte</text>
<text x="1338" y="520" fill="#fff" font-size="20">queda controlada</text>
<text x="570" y="520" fill="#fff" font-size="30">E2 · Corredor dos dentes  ←</text>
<text x="600" y="754" fill="#fff" font-size="20">chão mortal · dentes do teto = gancho · roxo obriga a pular um · pinos de gelo</text>
<text x="570" y="850" fill="#fff" font-size="30">E3 · Vale em V</text>
<text x="690" y="1234" fill="#fff" font-size="20">descer dá velocidade · a subida lança sobre o fosso</text>
<text x="1230" y="826" fill="#fff" font-size="26">✦ Farol 1</text>
<text x="1446" y="154" fill="#fff" font-size="30">E4 · Serpentina  ↑</text>
<text x="1446" y="190" fill="#fff" font-size="20">sobe pelos vãos · pontas roxas · faixas mortais</text>
<text x="1980" y="154" fill="#fff" font-size="30">E5 · Campo flutuante (em cima) ou Labirinto (embaixo)</text>
<text x="1980" y="190" fill="#fff" font-size="20">em cima: rápido, chão mortal · embaixo: lento e seguro</text>
